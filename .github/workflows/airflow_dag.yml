name: Airflow DAG CI

on:
    push:
        paths:
            - 'dags/**'
            - 'requirements.txt'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'dags/**'
            - 'requirements.txt'
            - '.github/workflows/**'
jobs:
    dag-validation:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                python-version: '3.11'
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Validate DAGs
              run: airflow dags list